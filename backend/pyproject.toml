[project]
name = "backend"
version = "0.1.0"
description = "FieldOps FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.14.1",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
hana = [
    "hdbcli>=2.30.24",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
