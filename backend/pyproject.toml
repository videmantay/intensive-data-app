[project]
name = "backend"
version = "0.1.0"
description = "FieldOps FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[ag-ui,logfire,openai,web]>=2.45.0",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
    "bleach>=6.0",
]

[project.optional-dependencies]
hana = [
    "hdbcli>=2.30.24",
    "sqlalchemy-hana>=4.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
